name: Semakan (kandungan, simulasi, bina)

# Hasil bina disimpan dalam repo (akar) dan dihidangkan oleh GitHub Pages
# mod "Deploy from a branch" / root. Workflow ini hanya menyemak PR dan push.
on:
  push:
  pull_request:

jobs:
  semak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sahkan kandungan cerita
        run: npm run sahkan
      - name: Simulasi 150 permainan (cari jalan buntu)
        run: npm run simulasi -- 150
      - name: Bina
        run: npm run build
      - name: Pastikan hasil bina yang di-commit terkini
        run: git diff --exit-code -- index.html || (echo "Jalankan npm run build dan commit hasilnya" && exit 1)
