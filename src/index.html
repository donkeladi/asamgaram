<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Asam Garam: Simulator Rumah Tangga Malaysia</title>
  <meta name="description" content="Asam Garam: hidupkan seorang bujang di Malaysia sehingga hari tua. Setiap keputusan kecil membentuk rumah tangga awak. Game web percuma dan sumber terbuka (18+)." />
  <meta name="theme-color" content="#e4572e" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./ikon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./ikon-180.png" />
</head>
<body>
  <div id="app" aria-live="polite"><p style="font-family:system-ui;padding:2rem;text-align:center">🌶️ Memuatkan Asam Garam…<br><small>Jika tulisan ini kekal, skrip gagal dimuatkan. Tekan Ctrl+Shift+R atau cuba tab incognito.</small></p></div>
  <script>
    window.addEventListener('error', function (e) {
      var a = document.getElementById('app');
      if (a && a.textContent.indexOf('Memuatkan') > -1) a.innerHTML = '<pre style="white-space:pre-wrap;padding:1rem;font:14px system-ui;color:#b00">Ralat memuatkan game:\n' + (e.message || e.target && e.target.src || 'tidak diketahui') + '</pre>';
    }, true);
  </script>
  <noscript>Asam Garam memerlukan JavaScript untuk dimainkan.</noscript>
  <script type="module" src="./main.ts"></script>
</body>
</html>
